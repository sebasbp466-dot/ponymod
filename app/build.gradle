plugins { id 'com.android.application' }
android {
    namespace 'com.ponymod.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ponymod.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        main {
            storeFile file('../ponymod.p12')
            storePassword 'ponymod123'
            keyAlias 'key'
            keyPassword 'ponymod123'
            storeType 'pkcs12'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.main } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
